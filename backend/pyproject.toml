[project]
name = "rag-xray-backend"
version = "0.1.0"
description = "Backend do RAG X-Ray: API FastAPI, grafo LangGraph e ingestão"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.7",
    "redis>=5.0",
    "numpy>=2.5.4",
    "langfuse>=5.2.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "eval"]
