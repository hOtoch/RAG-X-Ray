# Cada entrada é uma versão do pipeline (um experimento de ablação).
# O run_eval.py recebe o nome e salva o resultado em eval/results/<nome>.json.

v0:
  description: RAG ingênuo (busca densa top-k e geração direta)
  retrieval_mode: dense
  top_k: 5
  generate_tier: medium

v1-hybrid:
  description: v0 + retrieval híbrido (denso + BM25 fundidos por RRF), ainda sem rerank
  retrieval_mode: hybrid
  candidates_k: 20
  top_k: 5
  generate_tier: medium

v1:
  description: v1-hybrid + rerank com cross-encoder e orçamento de contexto
  retrieval_mode: hybrid
  candidates_k: 20
  top_k: 5
  rerank: true
  compress: true
  context_token_budget: 2000
  generate_tier: medium

v2:
  description: v1 + router, cascata de modelos por rota, multi-hop corretivo e checagem de groundedness
  retrieval_mode: hybrid
  candidates_k: 20
  top_k: 5
  multi_hop_top_k: 8
  rerank: true
  compress: true
  context_token_budget: 2000
  router: true
  groundedness: true
  escalate: true
  generate_tier: medium
  route_tiers:
    simple_rag: medium
    multi_hop: large

v3:
  description: v2 + cache exato e semântico (θ calibrado em eval/results/cache_threshold.json)
  retrieval_mode: hybrid
  candidates_k: 20
  top_k: 5
  multi_hop_top_k: 8
  rerank: true
  compress: true
  context_token_budget: 2000
  router: true
  groundedness: true
  escalate: true
  cache: true
  cache_threshold: 0.98
  generate_tier: medium
  route_tiers:
    simple_rag: medium
    multi_hop: large
